<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker Tractions</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --s1: #111;
  --s2: #181818;
  --s3: #1f1f1f;
  --acc: #e8ff47;
  --acc2: #ff6b35;
  --red: #ff4444;
  --green: #47ff8a;
  --text: #f0f0f0;
  --muted: #555;
  --border: #222;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; }

/* NAV */
.nav { display:flex; align-items:center; justify-content:space-between; padding:20px 32px; border-bottom:1px solid var(--border); }
.nav-logo { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px; color:var(--acc); }
.nav-week { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); }

/* HEADER */
.header { padding:48px 32px 32px; }
.header-top { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:24px; }
.header h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(48px,8vw,80px); line-height:0.9; letter-spacing:2px; }
.header h1 em { color:var(--acc); font-style:normal; }
.stat-row { display:flex; gap:32px; flex-wrap:wrap; }
.stat { text-align:center; }
.stat-val { font-family:'Bebas Neue',sans-serif; font-size:38px; line-height:1; }
.stat-val.green { color:var(--green); }
.stat-val.yellow { color:var(--acc); }
.stat-val.orange { color:var(--acc2); }
.stat-lbl { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-top:4px; }

/* NEXT SESSION BANNER */
.next-banner { margin:0 32px 32px; background:var(--s2); border-left:3px solid var(--acc); padding:20px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
.next-banner-left { display:flex; align-items:center; gap:16px; }
.next-dot { width:8px; height:8px; border-radius:50%; background:var(--acc); animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.next-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--acc); }
.next-title { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:1px; margin-top:2px; }
.next-prescriptions { display:flex; gap:12px; flex-wrap:wrap; }
.presc-tag { background:var(--s3); border:1px solid var(--border); padding:6px 14px; font-size:12px; font-family:'DM Mono',monospace; color:var(--acc); }

/* TABS */
.tabs { display:flex; padding:0 32px; border-bottom:1px solid var(--border); gap:0; }
.tab { padding:14px 24px; font-size:12px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; transition:all .2s; }
.tab.active { color:var(--acc); border-bottom-color:var(--acc); }
.tab:hover:not(.active) { color:var(--text); }

/* CONTENT */
.content { padding:32px; display:none; }
.content.active { display:block; }

/* SESSION LOG FORM */
.session-form { max-width:700px; }
.form-header { display:flex; align-items:center; gap:16px; margin-bottom:28px; }
.form-header h2 { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:1px; }
.session-type-selector { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-bottom:28px; }
.type-btn { background:var(--s2); padding:16px 12px; text-align:center; cursor:pointer; border:2px solid transparent; transition:all .2s; }
.type-btn.selected { border-color:var(--acc); background:var(--s3); }
.type-btn-name { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1px; }
.type-btn-tag { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-top:4px; }
.type-btn.selected .type-btn-tag { color:var(--acc); }

/* SERIES INPUT */
.series-inputs { display:grid; gap:8px; margin-bottom:24px; }
.serie-row { background:var(--s2); padding:12px 16px; display:grid; gap:10px; }
.serie-top { display:grid; grid-template-columns:80px 1fr 40px; align-items:center; gap:12px; }
.serie-label { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
.serie-input-wrap { display:flex; align-items:center; gap:8px; }
.rep-btn { width:32px; height:32px; background:var(--s3); border:none; color:var(--text); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
.rep-btn:hover { background:var(--acc); color:#000; }
.rep-val { font-family:'Bebas Neue',sans-serif; font-size:28px; min-width:40px; text-align:center; color:var(--acc); }
.serie-status { font-size:18px; }
/* MODALITY */
.serie-bottom { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.mod-btn { padding:4px 12px; background:var(--s3); border:1px solid var(--border); color:var(--muted); font-size:11px; letter-spacing:1px; cursor:pointer; transition:all .15s; white-space:nowrap; }
.mod-btn.active { border-color:var(--acc); color:var(--acc); background:#1a1f00; }
.mod-btn.active.leste { border-color:var(--acc2); color:var(--acc2); background:#1f0f00; }
.mod-btn.active.elasto { border-color:#47aaff; color:#47aaff; background:#001525; }
.mod-extra { display:flex; align-items:center; gap:6px; margin-left:4px; }
.mod-extra label { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
.mod-extra input { background:var(--s3); border:1px solid var(--border); color:var(--acc); font-family:'DM Mono',monospace; font-size:12px; padding:4px 8px; width:72px; outline:none; }
.mod-extra input:focus { border-color:var(--acc); }
.mod-tag { font-size:10px; padding:3px 8px; border-radius:0; }
.mod-tag.pdc { background:#1a1f00; color:var(--acc); border:1px solid var(--acc); }
.mod-tag.leste { background:#1f0f00; color:var(--acc2); border:1px solid var(--acc2); }
.mod-tag.elasto { background:#001525; color:#47aaff; border:1px solid #47aaff; }

/* FEELING */
.feeling-section { margin-bottom:24px; }
.feeling-label { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
.feeling-btns { display:flex; gap:8px; flex-wrap:wrap; }
.feel-btn { padding:8px 16px; background:var(--s2); border:1px solid var(--border); color:var(--muted); font-size:12px; cursor:pointer; transition:all .15s; }
.feel-btn.selected { border-color:var(--acc); color:var(--acc); background:var(--s3); }

/* SUBMIT */
.submit-btn { width:100%; padding:16px; background:var(--acc); color:#000; font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:3px; border:none; cursor:pointer; transition:opacity .2s; margin-top:8px; }
.submit-btn:hover { opacity:0.85; }

/* HISTORY */
.history-list { display:grid; gap:2px; max-width:700px; }
.history-item { background:var(--s2); padding:16px 20px; display:grid; grid-template-columns:90px 1fr auto; align-items:center; gap:16px; }
.hist-date { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
.hist-type { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1px; }
.hist-series { display:flex; gap:6px; flex-wrap:wrap; }
.hist-chip { background:var(--s3); padding:3px 10px; font-family:'DM Mono',monospace; font-size:11px; color:var(--acc); }
.hist-feel { font-size:18px; }
.empty-state { text-align:center; padding:80px 20px; color:var(--muted); }
.empty-state p { font-size:13px; margin-top:8px; }

/* ANALYSE */
.analyse-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:2px; max-width:900px; margin-bottom:32px; }
.analyse-card { background:var(--s2); padding:24px 20px; }
.analyse-card h3 { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
.progress-bar-wrap { margin-bottom:10px; }
.progress-bar-label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; }
.progress-bar-label span:first-child { color:var(--muted); }
.progress-bar-label span:last-child { color:var(--acc); font-family:'DM Mono',monospace; }
.progress-bar { height:4px; background:var(--s3); border-radius:0; overflow:hidden; }
.progress-bar-fill { height:100%; background:var(--acc); transition:width .6s ease; }

/* ADVICE BOX */
.advice-box { background:var(--s2); border-left:3px solid var(--acc2); padding:20px 24px; max-width:700px; margin-bottom:16px; }
.advice-box h3 { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1px; margin-bottom:8px; color:var(--acc2); }
.advice-box p { font-size:13px; color:#aaa; line-height:1.7; }

/* TOAST */
.toast { position:fixed; bottom:32px; right:32px; background:var(--acc); color:#000; padding:12px 24px; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; transform:translateY(80px); opacity:0; transition:all .3s; z-index:999; }
.toast.show { transform:translateY(0); opacity:1; }

/* WEIGHT CARD */
.weight-card { margin:0 32px 24px; padding:20px 24px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.weight-card.up   { background:#0f1a00; border:2px solid var(--green); }
.weight-card.same { background:#1a1400; border:2px solid var(--acc); }
.weight-card.down { background:#1a0800; border:2px solid var(--acc2); }
.weight-card.pdc  { background:#001020; border:2px solid #47aaff; }
.weight-icon { font-size:36px; line-height:1; }
.weight-main { flex:1; }
.weight-instruction { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:1px; line-height:1; }
.weight-card.up   .weight-instruction { color:var(--green); }
.weight-card.same .weight-instruction { color:var(--acc); }
.weight-card.down .weight-instruction { color:var(--acc2); }
.weight-card.pdc  .weight-instruction { color:#47aaff; }
.weight-reason { font-size:12px; color:#888; margin-top:6px; line-height:1.5; }
.weight-reason strong { color:var(--text); }
.week-progress { display:flex; gap:4px; margin-bottom:8px; flex-wrap:wrap; }
.week-dot { width:28px; height:28px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
.week-dot.done { background:var(--acc); border-color:var(--acc); color:#000; font-weight:600; }
.week-dot.today { border-color:var(--acc); color:var(--acc); }

@media(max-width:600px){
  .nav,.header,.content,.tabs { padding-left:20px; padding-right:20px; }
  .next-banner, .weight-card { margin-left:20px; margin-right:20px; }
  .session-type-selector { grid-template-columns:1fr; }
  .history-item { grid-template-columns:1fr 1fr; }
  .hist-feel { display:none; }
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-logo">PULL•TRACKER</div>
  <div class="nav-week" id="navWeek">Semaine 1 · Jour 1</div>
</div>

<div class="header">
  <div class="header-top">
    <div>
      <h1>MON <em>PROG</em></h1>
      <div class="week-progress" id="weekProgress"></div>
    </div>
    <div class="stat-row">
      <div class="stat">
        <div class="stat-val yellow" id="statMax">12</div>
        <div class="stat-lbl">Max actuel</div>
      </div>
      <div class="stat">
        <div class="stat-val green" id="statSessions">0</div>
        <div class="stat-lbl">Séances</div>
      </div>
      <div class="stat">
        <div class="stat-val orange" id="statTotal">0</div>
        <div class="stat-lbl">Total reps</div>
      </div>
    </div>
  </div>
</div>

<div class="next-banner" id="nextBanner">
  <div class="next-banner-left">
    <div class="next-dot"></div>
    <div>
      <div class="next-label">Prochaine séance</div>
      <div class="next-title" id="nextTitle">SÉANCE A — FORCE</div>
      <div id="chargeInBanner" style="margin-top:10px;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;"></div>
    </div>
  </div>
  <div class="next-prescriptions" id="nextPrescriptions"></div>
</div>

<div id="weightCard"></div>

<div class="tabs">
  <div class="tab active" onclick="showTab('log')">Enregistrer</div>
  <div class="tab" onclick="showTab('history')">Historique</div>
  <div class="tab" onclick="showTab('analyse')">Analyse</div>
</div>

<!-- LOG TAB -->
<div class="content active" id="tab-log">
  <div class="session-form">
    <div id="chargeHeader" style="margin-bottom:20px;padding:16px 20px;border-left:4px solid var(--acc2);background:#1a0e00;"></div>
    <div class="form-header">
      <h2>NOUVELLE SÉANCE</h2>
    </div>

    <div class="session-type-selector">
      <div class="type-btn selected" onclick="selectType('A')" id="btn-A">
        <div class="type-btn-name">A</div>
        <div class="type-btn-tag">Force Max</div>
      </div>
      <div class="type-btn" onclick="selectType('B')" id="btn-B">
        <div class="type-btn-name">B</div>
        <div class="type-btn-tag">Volume</div>
      </div>
      <div class="type-btn" onclick="selectType('C')" id="btn-C">
        <div class="type-btn-name">C</div>
        <div class="type-btn-tag">GTG</div>
      </div>
    </div>

    <div class="series-inputs" id="seriesContainer"></div>

    <div class="feeling-section">
      <div class="feeling-label">Ressenti global</div>
      <div class="feeling-btns">
        <div class="feel-btn" onclick="selectFeel('💀')" id="feel-💀">💀 Dur</div>
        <div class="feel-btn selected" onclick="selectFeel('😐')" id="feel-😐">😐 Normal</div>
        <div class="feel-btn" onclick="selectFeel('💪')" id="feel-💪">💪 Bien</div>
        <div class="feel-btn" onclick="selectFeel('🔥')" id="feel-🔥">🔥 En feu</div>
      </div>
    </div>

    <button class="submit-btn" onclick="saveSession()">VALIDER LA SÉANCE →</button>
  </div>
</div>

<!-- HISTORY TAB -->
<div class="content" id="tab-history">
  <div class="history-list" id="historyList">
    <div class="empty-state">
      <div style="font-size:40px">📋</div>
      <p>Aucune séance enregistrée pour l'instant.</p>
    </div>
  </div>
</div>

<!-- ANALYSE TAB -->
<div class="content" id="tab-analyse">
  <div id="adviceContainer"></div>
  <div class="analyse-grid" id="analyseGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let state = JSON.parse(localStorage.getItem('pulltracker') || 'null') || {
  maxReps: 12, sessions: [], currentType: 'A', weightKg: 10
};
// Migration : ajoute weightKg si absent
if (!state.weightKg) state.weightKg = 10;

let selectedType = 'A';
let selectedFeel = '😐';
let seriesValues = [];
let seriesModes = [];
let seriesExtra = [];

// ─── PROGRAM LOGIC ───────────────────────────────────────────────────────────

// Détermine la modalité recommandée pour séance A
// Règle : déjà lesté 10kg → continuer lesté. Monter le poids si 5×6+ propres. PDC si régression.
function recommendedModality(history, maxReps) {
  const lastA = history.filter(s => s.type === 'A').slice(-1)[0];

  // Pas d'historique → déjà lesté 10kg selon l'utilisateur
  if (!lastA) return { mode: 'leste', kg: state.weightKg || 10, hint: `Lesté +${state.weightKg||10} kg — ton niveau actuel` };

  const reps = lastA.series.slice(0,5);
  const plan  = getSessionPlan('A', history.slice(0,-1), maxReps); // objectifs de la séance passée
  const targets = plan.series.slice(0,5).map(s => s.target);
  const aboveTarget = reps.filter((r,i) => r >= targets[i]).length; // nb séries >= objectif
  const lastModes = lastA.modes || [];
  const lastExtras = lastA.extras || [];
  const lastKg = parseFloat(lastExtras.find((e,i) => lastModes[i]==='leste' && e)) || state.weightKg || 10;
  const feel = lastA.feel;

  // Trop lourd → retour PDC
  if (reps[0] < 4) return { mode: 'pdc', kg: 0, hint: 'PDC — trop lourd, retour poids de corps' };

  // Dépasse l'objectif sur ≥3 séries ET ressenti bon → augmenter le poids
  if (aboveTarget >= 3 && (feel === '💪' || feel === '🔥')) {
    const newKg = lastKg + 2.5;
    state.weightKg = newKg;
    localStorage.setItem('pulltracker', JSON.stringify(state));
    return { mode: 'leste', kg: newKg, hint: `Lesté +${newKg} kg — progression !` };
  }

  // Ressenti dur → réduire
  if (feel === '💀') {
    const newKg = Math.max(lastKg - 2.5, 5);
    return { mode: 'leste', kg: newKg, hint: `Lesté +${newKg} kg — légèrement réduit` };
  }

  return { mode: 'leste', kg: lastKg, hint: `Lesté +${lastKg} kg — même charge` };
}

function getSessionPlan(type, history, maxReps) {
  const last = history.filter(s => s.type === type).slice(-1)[0];

  if (type === 'A') {
    let targetReps = 5; // base : progression depuis 4 reps lestées
    if (last) {
      const avg = last.series.slice(0,5).reduce((a,b)=>a+b,0)/5;
      const feel = last.feel;
      if (feel === '🔥' || feel === '💪') targetReps = Math.min(Math.round(avg) + 1, 10);
      else if (feel === '💀') targetReps = Math.max(Math.round(avg) - 1, 3);
      else targetReps = Math.round(avg);
    }
    const australianTarget = last ? Math.min((last.series[5]||10) + (last.feel==='🔥'?1:0), 14) : 10;
    const mod = recommendedModality(history, maxReps);
    return {
      title: 'SÉANCE A — FORCE',
      description: 'Force maximale',
      modality: mod,
      series: [
        { label: 'Traction 1', target: targetReps, mod: mod.mode, kg: mod.kg },
        { label: 'Traction 2', target: targetReps, mod: mod.mode, kg: mod.kg },
        { label: 'Traction 3', target: Math.max(targetReps-1,3), mod: mod.mode, kg: mod.kg },
        { label: 'Traction 4', target: Math.max(targetReps-1,3), mod: mod.mode, kg: mod.kg },
        { label: 'Traction 5', target: Math.max(targetReps-2,2), mod: mod.mode, kg: mod.kg },
        { label: 'Australienne 1', target: australianTarget, mod: 'pdc', kg: 0 },
        { label: 'Australienne 2', target: australianTarget, mod: 'pdc', kg: 0 },
        { label: 'Australienne 3', target: australianTarget, mod: 'pdc', kg: 0 },
      ]
    };
  }
  if (type === 'B') {
    let target = Math.floor(maxReps * 0.6);
    if (last) {
      const avg = last.series.slice(0,5).reduce((a,b)=>a+b,0)/5;
      if (last.feel === '🔥' || last.feel === '💪') target = Math.round(avg) + 1;
      else if (last.feel === '💀') target = Math.max(Math.round(avg) - 1, 4);
      else target = Math.round(avg);
    }
    const isoTarget = last ? Math.min((last.series[5]||6) + (last.feel==='🔥'?1:0), 15) : 6;
    return {
      title: 'SÉANCE B — VOLUME',
      description: 'Endurance · toujours PDC',
      modality: { mode: 'pdc', hint: 'PDC — séance volume, pas de charge' },
      series: [
        { label: 'Traction 1', target: target, mod: 'pdc' },
        { label: 'Traction 2', target: target, mod: 'pdc' },
        { label: 'Traction 3', target: target, mod: 'pdc' },
        { label: 'Traction 4', target: Math.max(target-1,4), mod: 'pdc' },
        { label: 'Traction 5', target: Math.max(target-1,4), mod: 'pdc' },
        { label: 'Iso haute (sec)', target: isoTarget, mod: 'pdc' },
        { label: 'Iso haute (sec)', target: isoTarget, mod: 'pdc' },
      ]
    };
  }
  const gtgTarget = last ? Math.min((last.series[0]||4)+1, 6) : 4;
  return {
    title: 'SÉANCE C — GREASE THE GROOVE',
    description: 'Toutes les 2h · PDC uniquement',
    modality: { mode: 'pdc', hint: 'PDC — GTG, jamais de charge' },
    series: [
      { label: 'Mini-set 1', target: gtgTarget, mod: 'pdc' },
      { label: 'Mini-set 2', target: gtgTarget, mod: 'pdc' },
      { label: 'Mini-set 3', target: gtgTarget, mod: 'pdc' },
      { label: 'Mini-set 4', target: gtgTarget, mod: 'pdc' },
      { label: 'Mini-set 5', target: gtgTarget, mod: 'pdc' },
    ]
  };
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  updateStats();
  updateNextBanner();
  renderWeekProgress();
  renderSeries();
  renderHistory();
  renderAnalyse();
}

function updateStats() {
  document.getElementById('statMax').textContent = state.maxReps;
  document.getElementById('statSessions').textContent = state.sessions.length;
  const total = state.sessions.reduce((sum, s) => sum + s.series.reduce((a,b)=>a+b,0), 0);
  document.getElementById('statTotal').textContent = total;
  // Update week display
  const week = Math.floor(state.sessions.length / 3) + 1;
  const day = (state.sessions.length % 3) + 1;
  document.getElementById('navWeek').textContent = `Semaine ${Math.min(week,6)} · Séance ${day}/3`;
}

function updateNextBanner() {
  const order = ['A','B','C'];
  const nextType = order[state.sessions.length % 3];
  const plan = getSessionPlan(nextType, state.sessions, state.maxReps);
  document.getElementById('nextTitle').textContent = plan.title;

  const container = document.getElementById('nextPrescriptions');
  container.innerHTML = '';

  const mod = plan.modality;
  const modColors = { pdc: '#e8ff47', leste: '#ff6b35', elasto: '#47aaff' };
  const modIcons  = { pdc: '🏋 PDC', leste: '⚖️ Lesté', elasto: '🔵 Élastique' };
  const badge = document.createElement('div');
  badge.className = 'presc-tag';
  badge.style.borderColor = modColors[mod.mode];
  badge.style.color = modColors[mod.mode];
  badge.textContent = modIcons[mod.mode] + (mod.kg ? ' +' + mod.kg + ' kg' : '');
  container.appendChild(badge);

  plan.series.forEach(s => {
    const tag = document.createElement('div');
    tag.className = 'presc-tag';
    tag.textContent = `${s.label}: ${s.target}`;
    container.appendChild(tag);
  });

  // ── WEIGHT CARD ──────────────────────────────────────────────────────────
  const wc = document.getElementById('weightCard');
  const lastA = state.sessions.filter(s => s.type === 'A').slice(-1)[0];

  if (nextType !== 'A') {
    wc.innerHTML = `<div class="weight-card pdc">
      <div class="weight-icon">🏋</div>
      <div class="weight-main">
        <div class="weight-instruction">POIDS DE CORPS</div>
        <div class="weight-reason">Séance ${nextType} — toujours en PDC, pas de charge.</div>
      </div>
    </div>`;
    selectType(nextType, true);
    return;
  }

  if (!lastA) {
    wc.innerHTML = `<div class="weight-card same">
      <div class="weight-icon">⚖️</div>
      <div class="weight-main">
        <div class="weight-instruction">LESTÉ +${state.weightKg || 10} KG</div>
        <div class="weight-reason"><strong>Ton niveau actuel.</strong> Mets +${state.weightKg||10} kg sur la ceinture ou dans un sac pour toutes les tractions de la séance A.</div>
      </div>
    </div>`;
    selectType(nextType, true);
    return;
  }

  // Calcul basé sur dernière séance A
  const reps = lastA.series.slice(0,5);
  const minReps = Math.min(...reps);
  const lastExtras = lastA.extras || [];
  const lastModes = lastA.modes || [];
  const lastKg = parseFloat(lastExtras.find((e,i) => lastModes[i]==='leste' && e)) || state.weightKg || 10;
  const feel = lastA.feel;

  let cssClass, icon, instruction, reason;

  if (reps[0] < 4) {
    cssClass = 'pdc'; icon = '🏋';
    instruction = 'RETOUR POIDS DE CORPS';
    reason = `<strong>Trop lourd ce jour-là</strong> — repasse en PDC le temps de consolider ta base. Tu retourneras lesté dès que tu enchaînes 5×5 propres.`;
  } else if (minReps >= 6 && (feel === '💪' || feel === '🔥')) {
    const newKg = lastKg + 2.5;
    cssClass = 'up'; icon = '📈';
    instruction = `MONTE À +${newKg} KG`;
    reason = `<strong>Tu as réussi 5×${minReps}+ avec +${lastKg} kg</strong> et tu te sentais ${feel} — c'est le signal pour progresser.`;
  } else if (feel === '💀') {
    const newKg = Math.max(lastKg - 2.5, 5);
    cssClass = 'down'; icon = '📉';
    instruction = `DESCENDS À +${newKg} KG`;
    reason = `<strong>Séance difficile à +${lastKg} kg</strong> — réduis légèrement pour consolider avant de remonter.`;
  } else {
    cssClass = 'same'; icon = '⚖️';
    instruction = `GARDE +${lastKg} KG`;
    reason = `<strong>Bonne séance à +${lastKg} kg</strong> — maintiens la même charge et vise à améliorer les reps.`;
  }

  wc.innerHTML = `<div class="weight-card ${cssClass}">
    <div class="weight-icon">${icon}</div>
    <div class="weight-main">
      <div class="weight-instruction">${instruction}</div>
      <div class="weight-reason">${reason}</div>
    </div>
  </div>`;

  // ── Charge visible dans le bandeau ET dans le formulaire ─────────────────
  const chargeInBanner = document.getElementById('chargeInBanner');
  const chargeHeader   = document.getElementById('chargeHeader');

  let chargeText = '', chargeSub = '', chargeColor = 'var(--acc)';

  if (nextType !== 'A') {
    chargeText  = '🏋 POIDS DE CORPS';
    chargeSub   = 'Séance ' + nextType + ' — pas de charge ajoutée';
    chargeColor = '#47aaff';
  } else {
    const lastA2 = state.sessions.filter(s => s.type === 'A').slice(-1)[0];
    if (!lastA2) {
      chargeText  = '⚖️ LESTÉ +' + (state.weightKg||10) + ' KG';
      chargeSub   = 'Ton niveau actuel — mets +' + (state.weightKg||10) + ' kg sur toutes les tractions';
      chargeColor = 'var(--acc)';
    } else {
      const reps2    = lastA2.series.slice(0,5);
      const plan2    = getSessionPlan('A', state.sessions.slice(0,-1), state.maxReps);
      const tgts2    = plan2.series.slice(0,5).map(s => s.target);
      const above2   = reps2.filter((r,i) => r >= tgts2[i]).length;
      const lExtras  = lastA2.extras || [];
      const lModes   = lastA2.modes  || [];
      const lKg      = parseFloat(lExtras.find((e,i)=>lModes[i]==='leste'&&e)) || state.weightKg || 10;
      const feel2    = lastA2.feel;
      if (reps2[0] < 4) {
        chargeText = '🏋 RETOUR PDC'; chargeSub = 'Trop lourd — repasse en poids de corps'; chargeColor = '#47aaff';
      } else if (above2 >= 3 && (feel2==='💪'||feel2==='🔥')) {
        chargeText = '📈 MONTE À +' + (lKg+2.5) + ' KG'; chargeSub = above2 + '/5 séries au-dessus de l\'objectif à +' + lKg + 'kg — tu progresses !'; chargeColor = 'var(--green)';
      } else if (feel2 === '💀') {
        chargeText = '📉 DESCENDS À +' + Math.max(lKg-2.5,5) + ' KG'; chargeSub = 'Séance difficile — réduis légèrement'; chargeColor = 'var(--acc2)';
      } else {
        chargeText = '⚖️ GARDE +' + lKg + ' KG'; chargeSub = 'Bonne séance — même charge, améliore les reps'; chargeColor = 'var(--acc)';
      }
    }
  }

  if (chargeInBanner) {
    chargeInBanner.style.color = chargeColor;
    chargeInBanner.textContent = chargeText;
  }
  if (chargeHeader) {
    chargeHeader.innerHTML = `
      <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:${chargeColor}">${chargeText}</div>
      <div style="font-size:12px;color:#aaa;margin-top:4px">${chargeSub}</div>`;
  }

  selectType(nextType, true);
}

function renderWeekProgress() {
  const container = document.getElementById('weekProgress');
  container.innerHTML = '';
  const labels = ['A','B','C','A','B','C','A','B','C','A','B','C','A','B','C','A','B','C'];
  for (let i = 0; i < 18; i++) {
    const dot = document.createElement('div');
    dot.className = 'week-dot';
    dot.textContent = labels[i];
    if (i < state.sessions.length) dot.classList.add('done');
    else if (i === state.sessions.length) dot.classList.add('today');
    container.appendChild(dot);
  }
}

// ─── SERIES UI ────────────────────────────────────────────────────────────────
function renderSeries() {
  const plan = getSessionPlan(selectedType, state.sessions, state.maxReps);
  seriesValues = plan.series.map(s => s.target);
  seriesModes = plan.series.map(s => s.mod || 'pdc');
  seriesExtra = plan.series.map(s => s.kg ? String(s.kg) : '');

  const container = document.getElementById('seriesContainer');
  container.innerHTML = '';

  plan.series.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'serie-row';
    const showMod = !s.label.toLowerCase().includes('iso');
    const defaultMod = s.mod || 'pdc';
    const defaultKg = s.kg || '';

    row.innerHTML = `
      <div class="serie-top">
        <div class="serie-label">${s.label}</div>
        <div class="serie-input-wrap">
          <button class="rep-btn" onclick="changeRep(${i},-1)">−</button>
          <div class="rep-val" id="repVal-${i}">${s.target}</div>
          <button class="rep-btn" onclick="changeRep(${i},+1)">+</button>
          ${defaultMod === 'leste' ? `<div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--acc2);margin-left:8px;">+${defaultKg}kg</div>` : ''}
          ${defaultMod === 'elasto' ? `<div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:#47aaff;margin-left:8px;">🔵</div>` : ''}
          ${defaultMod === 'pdc' ? `<div style="font-size:13px;color:var(--muted);margin-left:8px;">PDC</div>` : ''}
        </div>
        <div class="serie-status" id="repStatus-${i}">—</div>
      </div>
      ${showMod ? `
      <div class="serie-bottom" id="modRow-${i}">
        <button class="mod-btn ${defaultMod==='pdc'?'active':''}" id="mod-pdc-${i}" onclick="setMode(${i},'pdc')">🏋 PDC</button>
        <button class="mod-btn leste ${defaultMod==='leste'?'active':''}" id="mod-leste-${i}" onclick="setMode(${i},'leste')">⚖️ Lesté</button>
        <button class="mod-btn elasto ${defaultMod==='elasto'?'active':''}" id="mod-elasto-${i}" onclick="setMode(${i},'elasto')">🔵 Élastique</button>
        <div class="mod-extra" id="modExtra-${i}" style="display:${defaultMod!=='pdc'?'flex':'none'}">
          <label id="modExtraLabel-${i}">${defaultMod==='leste'?'kg ajoutés':'bande n°'}</label>
          <input type="number" id="modExtraVal-${i}" min="0" step="0.5" placeholder="0" value="${defaultMod==='leste'&&defaultKg?defaultKg:''}"
            oninput="seriesExtra[${i}]=this.value">
        </div>
      </div>` : ''}
    `;
    container.appendChild(row);
  });
}

function changeRep(i, delta) {
  seriesValues[i] = Math.max(0, seriesValues[i] + delta);
  document.getElementById('repVal-'+i).textContent = seriesValues[i];
  // Compute status vs target
  const plan = getSessionPlan(selectedType, state.sessions, state.maxReps);
  const target = plan.series[i].target;
  const status = document.getElementById('repStatus-'+i);
  if (seriesValues[i] >= target) status.textContent = '✅';
  else if (seriesValues[i] >= target - 1) status.textContent = '👌';
  else status.textContent = '❌';
}

function selectType(type, silent) {
  selectedType = type;
  ['A','B','C'].forEach(t => {
    document.getElementById('btn-'+t).classList.toggle('selected', t===type);
  });
  if (!silent) renderSeries();
}

function selectFeel(f) {
  selectedFeel = f;
  ['💀','😐','💪','🔥'].forEach(e => {
    document.getElementById('feel-'+e).classList.toggle('selected', e===f);
  });
}

function setMode(i, mode) {
  seriesModes[i] = mode;
  ['pdc','leste','elasto'].forEach(m => {
    const btn = document.getElementById('mod-'+m+'-'+i);
    if (!btn) return;
    btn.classList.remove('active');
  });
  const activeBtn = document.getElementById('mod-'+mode+'-'+i);
  if (activeBtn) activeBtn.classList.add('active');

  const extraDiv = document.getElementById('modExtra-'+i);
  const extraLabel = document.getElementById('modExtraLabel-'+i);
  if (!extraDiv) return;
  if (mode === 'leste') {
    extraDiv.style.display = 'flex';
    extraLabel.textContent = 'kg ajoutés';
  } else if (mode === 'elasto') {
    extraDiv.style.display = 'flex';
    extraLabel.textContent = 'bande n°';
  } else {
    extraDiv.style.display = 'none';
    seriesExtra[i] = '';
  }
}

// ─── SAVE SESSION ─────────────────────────────────────────────────────────────
function saveSession() {
  const session = {
    type: selectedType,
    date: new Date().toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit'}),
    series: [...seriesValues],
    modes: [...seriesModes],
    extras: [...seriesExtra],
    feel: selectedFeel,
    ts: Date.now()
  };
  state.sessions.push(session);

  // Update max reps if first series is personal best
  if (selectedType === 'A' && seriesValues[0] > state.maxReps) {
    state.maxReps = seriesValues[0];
  }

  localStorage.setItem('pulltracker', JSON.stringify(state));
  showToast('SÉANCE ENREGISTRÉE 🔥');
  init();
  showTab('history');
}

// ─── HISTORY ──────────────────────────────────────────────────────────────────
function renderHistory() {
  const list = document.getElementById('historyList');
  if (!state.sessions.length) {
    list.innerHTML = `<div class="empty-state"><div style="font-size:40px">📋</div><p>Aucune séance enregistrée.</p></div>`;
    return;
  }
  list.innerHTML = '';
  [...state.sessions].reverse().forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'history-item';
    const chips = s.series.map((r, idx) => {
      const mode = (s.modes && s.modes[idx]) || 'pdc';
      const extra = (s.extras && s.extras[idx]) ? s.extras[idx] : '';
      const modeLabel = mode === 'leste' ? `⚖️${extra ? '+'+extra+'kg' : ''}` : mode === 'elasto' ? `🔵${extra ? ' #'+extra : ''}` : '🏋';
      const cls = mode === 'leste' ? 'leste' : mode === 'elasto' ? 'elasto' : 'pdc';
      return `<span class="hist-chip"><span class="mod-tag ${cls}">${modeLabel}</span> ${r}</span>`;
    }).join('');
    item.innerHTML = `
      <div>
        <div class="hist-date">${s.date}</div>
        <div class="hist-type">SÉA. ${s.type}</div>
      </div>
      <div class="hist-series">${chips}</div>
      <div class="hist-feel">${s.feel}</div>
    `;
    list.appendChild(item);
  });
}

// ─── ANALYSE ──────────────────────────────────────────────────────────────────
function renderAnalyse() {
  const grid = document.getElementById('analyseGrid');
  const advice = document.getElementById('adviceContainer');
  grid.innerHTML = '';
  advice.innerHTML = '';

  if (!state.sessions.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div style="font-size:40px">📊</div><p>Enregistre ta première séance pour voir l'analyse.</p></div>`;
    return;
  }

  // Progression 1ère série séance A
  const sessionsA = state.sessions.filter(s => s.type === 'A');
  const sessionsB = state.sessions.filter(s => s.type === 'B');

  if (sessionsA.length) {
    const card = document.createElement('div');
    card.className = 'analyse-card';
    let html = '<h3>Progression 1ère série (A)</h3>';
    const prog = Math.round((state.maxReps - 12) / (18 - 12) * 100);
    html += `<div class="progress-bar-wrap">
      <div class="progress-bar-label"><span>Objectif 18 reps</span><span>${state.maxReps} reps</span></div>
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${Math.max(prog,0)}%"></div></div>
    </div>`;
    sessionsA.forEach((s,i) => {
      const pct = Math.round(s.series[0]/18*100);
      html += `<div class="progress-bar-wrap">
        <div class="progress-bar-label"><span>Séance A${i+1} · ${s.date}</span><span>${s.series[0]} reps</span></div>
        <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    });
    card.innerHTML = html;
    grid.appendChild(card);
  }

  if (sessionsB.length) {
    const card = document.createElement('div');
    card.className = 'analyse-card';
    let html = '<h3>Volume total (B)</h3>';
    sessionsB.forEach((s,i) => {
      const vol = s.series.slice(0,5).reduce((a,b)=>a+b,0);
      const pct = Math.round(vol/50*100);
      html += `<div class="progress-bar-wrap">
        <div class="progress-bar-label"><span>Séance B${i+1} · ${s.date}</span><span>${vol} reps</span></div>
        <div class="progress-bar"><div class="progress-bar-fill" style="width:${Math.min(pct,100)}%"></div></div>
      </div>`;
    });
    card.innerHTML = html;
    grid.appendChild(card);
  }

  // Conseil automatique
  const last = state.sessions[state.sessions.length-1];
  let msg = '';
  if (last.feel === '💀') msg = `Dernière séance difficile — la prochaine a été ajustée à la baisse. Concentre-toi sur la qualité du mouvement plutôt que la quantité.`;
  else if (last.feel === '🔥') msg = `Belle séance ! Les objectifs ont été revus à la hausse. Continue sur cette dynamique.`;
  else if (last.feel === '💪') msg = `Bonne séance. Progression légère prévue pour la prochaine.`;
  else msg = `Séance correcte. La prochaine séance reprend les mêmes objectifs.`;

  if (state.sessions.length >= 6 && state.sessions.length % 6 === 0) {
    msg += ` Tu arrives à la fin d'un cycle — c'est le moment de tester ton nouveau max !`;
  }

  const box = document.createElement('div');
  box.className = 'advice-box';
  box.innerHTML = `<h3>💡 Conseil automatique</h3><p>${msg}</p>`;
  advice.appendChild(box);
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function showTab(id) {
  document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  document.querySelectorAll('.tab').forEach(el => {
    if (el.getAttribute('onclick').includes(id)) el.classList.add('active');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
