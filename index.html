<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Muscle-Up & Running</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .active-tab { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-blue-400 flex items-center gap-2">
                    ⚡ Muscle-Up & Running Tracker
                </h1>
                <p class="text-xs text-slate-400">Programme 5 Jours (Renforcement & Course)</p>
            </div>
            <button onclick="exportData()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded transition">
                Exporter Data
            </button>
        </div>
        
        <!-- Navigation Tabs -->
        <div class="max-w-4xl mx-auto px-4 flex gap-4 text-sm overflow-x-auto border-t border-slate-700/50">
            <button onclick="switchTab('lundi')" id="tab-lundi" class="py-3 px-2 whitespace-nowrap active-tab">Lundi (MU & Exp)</button>
            <button onclick="switchTab('mardi')" id="tab-mardi" class="py-3 px-2 whitespace-nowrap text-slate-400">Mardi (Lest & Force)</button>
            <button onclick="switchTab('mercredi')" id="tab-mercredi" class="py-3 px-2 whitespace-nowrap text-slate-400">Mercredi (Running 🏃‍♂️)</button>
            <button onclick="switchTab('jeudi')" id="tab-jeudi" class="py-3 px-2 whitespace-nowrap text-slate-400">Jeudi (Vitesse & Skill)</button>
            <button onclick="switchTab('vendredi')" id="tab-vendredi" class="py-3 px-2 whitespace-nowrap text-slate-400">Vendredi (Volume)</button>
            <button onclick="switchTab('history')" id="tab-history" class="py-3 px-2 whitespace-nowrap text-slate-400">Historique</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Échauffement / Info Bar -->
        <div id="info-bar" class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 mb-6 flex justify-between items-center">
            <div>
                <h3 class="font-semibold text-sm text-slate-200 flex items-center gap-2" id="info-bar-title">
                    ⏱️ Échauffement STO (8-10 min)
                </h3>
                <p class="text-xs text-slate-400" id="info-bar-desc">Mobilisation → Scapula (2x6) & Facepulls (2x12) → Activation (2x3 reps)</p>
            </div>
            <span class="text-xs font-mono bg-blue-900/50 text-blue-300 px-2.5 py-1 rounded border border-blue-700/50" id="info-bar-tag">1h Max Session</span>
        </div>

        <!-- Seances Content -->
        <div id="workout-container">
            <!-- Dynamic Content Injected via JS -->
        </div>

    </main>

    <script>
        const PROGRAM = {
            lundi: {
                title: "Lundi — Muscle-Up PDC & Explosivité",
                desc: "100% de fraîcheur nerveuse. Objectif : valider le MU PDC et développer la hauteur.",
                infoTitle: "⏱️ Échauffement STO (8-10 min)",
                infoDesc: "Mobilisation → Scapula (2x6) & Facepulls (2x12) → Activation (2x3 reps)",
                infoTag: "1h Max Session",
                exercises: [
                    { id: "mu_pdc", name: "Muscle-Up PDC", target: "4-5 sets × 1 rep", rest: "2m30", type: "mu", notes: "Arrêter dès qu'un chicken wing apparaît." },
                    { id: "high_pulls_lundi", name: "High Pull-ups (Traction Nombril)", target: "4 sets × 3 reps", rest: "2m00", type: "reps", notes: "Vitesse maximale dès le bas. Trajectoire en C." },
                    { id: "pullups_pdc_lundi", name: "Tractions PDC (Volume propre)", target: "3 sets × 6-7 reps", rest: "2m00", type: "reps", notes: "Sous-maximal, poitrine haute." },
                    { id: "leg_raises_lundi", name: "Leg Raises à la barre (Option 2)", target: "3 sets × Max reps", rest: "1m00", type: "reps", notes: "Cible : 8 - 6 - 6 reps sans élan." }
                ]
            },
            mardi: {
                title: "Mardi — Force & Tirage Lesté (Sans Triceps)",
                desc: "Focus force pure sur le tirage pour alimenter la réserve de puissance.",
                infoTitle: "⏱️ Échauffement STO (8-10 min)",
                infoDesc: "Focus poignets, omoplates et coudes pour préparer le lest (+10kg)",
                infoTag: "1h Max Session",
                exercises: [
                    { id: "pullups_weighted", name: "Tractions Lestées (+kg)", target: "4 sets × 3-4 reps", rest: "2m30", type: "weight", notes: "Actuellement à +10kg. Amplitude complète." },
                    { id: "push_light", name: "Développé Militaire léger / Épaules", target: "3 sets × 8-10 reps", rest: "1m30", type: "reps", notes: "Sans triceps forcés (préserver le coude)." },
                    { id: "pullups_degressif", name: "Tractions PDC (Strictes)", target: "2 sets × 6 reps", rest: "2m00", type: "reps", notes: "Qualité d'exécution dégressive." },
                    { id: "hollow_body", name: "Hollow Body Hold", target: "3 sets × 40 sec", rest: "0m45", type: "reps", notes: "Plaquer le bas du dos au sol." }
                ]
            },
            mercredi: {
                title: "Mercredi — Course à Pied (Endurance & Cardio)",
                desc: "Séance d'aérobie pour développer le cardio et libérer les membres supérieurs.",
                infoTitle: "🏃‍♂️ Running & Récupération Active",
                infoDesc: "Pense à t'hydrater et à faire 5 min de mobilité des chevilles/mollets.",
                infoTag: "Cardio & Legs",
                exercises: [
                    { id: "running_session", name: "Session de Course à Pied", target: "Distance / Temps libre", rest: "—", type: "running", notes: "Saisis ta distance et ton temps total. L'allure s'exprime automatiquement en min/km." }
                ]
            },
            jeudi: {
                title: "Jeudi — Explosivité & Vitesse de Tirage",
                desc: "Travailler le recrutement rapide des fibres pour casser le manque d'explosivité.",
                infoTitle: "⏱️ Échauffement STO (8-10 min)",
                infoDesc: "Mobilisation rapide et travail de vitesse d'arrachement à vide",
                infoTag: "1h Max Session",
                exercises: [
                    { id: "high_pulls_jeudi", name: "High Pull-ups (Explosivité pure)", target: "4 sets × 3 reps", rest: "2m30", type: "reps", notes: "Intention de vitesse maximale !" },
                    { id: "transitions", name: "Transitions (Élastique léger / Anneaux)", target: "3 sets × 3-5 reps", rest: "2m00", type: "reps", notes: "Focus bascule rapide des épaules." },
                    { id: "shoulders", name: "Élévations Latérales / Face Pulls", target: "3 sets × 12-15 reps", rest: "1m00", type: "reps", notes: "Santé de l'épaule." },
                    { id: "plank_rolls", name: "Plank Roll-outs (Gainage)", target: "3 sets × 10 reps", rest: "0m45", type: "reps", notes: "Maintien rigide du tronc." }
                ]
            },
            vendredi: {
                title: "Vendredi — Volume Strict & Abdos",
                desc: "Engranger du volume qualitatif pour consolider la masse du dos et la poigne.",
                infoTitle: "⏱️ Échauffement STO (8-10 min)",
                infoDesc: "Mobilisation épaules & avant-bras avant le gros bloc de tirage",
                infoTag: "1h Max Session",
                exercises: [
                    { id: "pullups_strict_vendredi", name: "Tractions Strictes PDC", target: "4 sets × 6-7 reps", rest: "2m00", type: "reps", notes: "Strictes, menton bien au-dessus." },
                    { id: "chinups", name: "Tractions Supination (Chin-ups)", target: "3 sets × 7-8 reps", rest: "1m30", type: "reps", notes: "Engagement biceps / grand dorsal." },
                    { id: "australian", name: "Rowing Inversé (Australian)", target: "3 sets × 10-12 reps", rest: "1m30", type: "reps", notes: "Fixation des omoplates." },
                    { id: "leg_raises_vendredi", name: "Leg Raises à la barre (Option 2)", target: "3-4 sets × Max", rest: "1m00", type: "reps", notes: "Chercher à battre ton score du lundi !" }
                ]
            }
        };

        let currentTab = 'lundi';
        let logs = JSON.parse(localStorage.getItem('mu_tracker_logs')) || {};

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.remove('active-tab', 'text-blue-400'));
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('text-slate-400'));
            
            const activeEl = document.getElementById(`tab-${tabId}`);
            if(activeEl) {
                activeEl.classList.add('active-tab');
                activeEl.classList.remove('text-slate-400');
            }

            // Update Info Bar
            if (PROGRAM[tabId]) {
                document.getElementById('info-bar').style.display = 'flex';
                document.getElementById('info-bar-title').innerText = PROGRAM[tabId].infoTitle;
                document.getElementById('info-bar-desc').innerText = PROGRAM[tabId].infoDesc;
                document.getElementById('info-bar-tag').innerText = PROGRAM[tabId].infoTag;
            } else {
                document.getElementById('info-bar').style.display = 'none';
            }

            render();
        }

        function saveLog(exId, data) {
            const date = new Date().toISOString().split('T')[0];
            if (!logs[date]) logs[date] = {};
            logs[date][exId] = data;
            localStorage.setItem('mu_tracker_logs', JSON.stringify(logs));
            render();
        }

        function calculatePace(km, minutes, seconds) {
            if (!km || km <= 0 || (!minutes && !seconds)) return null;
            const totalSeconds = (parseInt(minutes) || 0) * 60 + (parseInt(seconds) || 0);
            if (totalSeconds <= 0) return null;
            
            const paceSecondsPerKm = totalSeconds / parseFloat(km);
            const paceMin = Math.floor(paceSecondsPerKm / 60);
            const paceSec = Math.round(paceSecondsPerKm % 60);
            
            return `${paceMin}'${paceSec < 10 ? '0' : ''}${paceSec}" /km`;
        }

        function getProgressRecommendation(exId, type) {
            const history = [];
            Object.keys(logs).sort().reverse().forEach(date => {
                if (logs[date][exId]) history.push(logs[date][exId]);
            });

            if (history.length === 0) return "Entrez tes résultats pour activer les conseils de progression.";

            const last = history[0];

            if (type === 'running') {
                if (last.km && last.pace) {
                    return `🏃‍♂️ Dernier run : ${last.km} km en ${last.min || 0}m${last.sec || 0}s (Allure: ${last.pace}). Régularité avant tout !`;
                }
                return "🏃‍♂️ Entre la distance et la durée de ta course pour suivre ton allure.";
            }

            if (type === 'mu') {
                if (last.succes >= 3) return "🔥 Excellent ! Conserve cette fraîcheur. Objectif séance suivante : maintenir 4-5 reps parfaites.";
                return "💡 Reste concentré sur la vitesse. Ne force pas de reps moches.";
            }

            if (type === 'weight') {
                if (last.reps >= 4 && last.weight >= 10) {
                    return `📈 Progressive Overload : Tu as validé ${last.reps} reps à +${last.weight}kg. Tente +11.25kg ou +12.5kg la prochaine fois !`;
                }
                return `💪 Reste à +${last.weight || 10}kg jusqu'à valider 4 reps propres sur toutes les séries.`;
            }

            if (type === 'reps') {
                return `🎯 Dernier score : ${last.reps || last.sets}. Tente d'ajouter 1 rep au total sur ta séance.`;
            }

            return "";
        }

        function renderWorkout(dayKey) {
            const data = PROGRAM[dayKey];
            const dateToday = new Date().toISOString().split('T')[0];
            const todayLogs = logs[dateToday] || {};

            let html = `
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-slate-100">${data.title}</h2>
                    <p class="text-sm text-slate-400 mt-1">${data.desc}</p>
                </div>
                <div class="space-y-4">
            `;

            data.exercises.forEach(ex => {
                const exLog = todayLogs[ex.id] || {};
                const advice = getProgressRecommendation(ex.id, ex.type);

                html += `
                    <div class="bg-slate-800 rounded-xl p-5 border border-slate-700/70 shadow-lg">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h4 class="font-bold text-blue-300 text-lg">${ex.name}</h4>
                                <span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-mono">${ex.target}</span>
                                <span class="text-xs bg-slate-900 text-slate-400 px-2 py-0.5 rounded font-mono ml-2">⏱️ Repos: ${ex.rest}</span>
                            </div>
                        </div>
                        <p class="text-xs text-slate-400 mb-4 italic">💡 ${ex.notes}</p>

                        <!-- Surcharge / Stat Conseil -->
                        <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50 mb-4 text-xs text-amber-300 flex items-center gap-2">
                            <span>🧠</span>
                            <span>${advice}</span>
                        </div>

                        <!-- Form Input -->
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 bg-slate-900/40 p-3 rounded-lg border border-slate-700/30">
                `;

                if (ex.type === 'running') {
                    const calculatedPace = calculatePace(exLog.km, exLog.min, exLog.sec) || exLog.pace || '—';

                    html += `
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Distance (km)</label>
                            <input type="number" step="0.01" value="${exLog.km || ''}" onchange="
                                const current = getLog('${ex.id}');
                                const km = parseFloat(this.value);
                                const pace = calculatePace(km, current.min, current.sec);
                                saveLog('${ex.id}', {...current, km: km, pace: pace});
                            " class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-center" placeholder="ex: 5.5">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Temps (Min / Sec)</label>
                            <div class="flex gap-1">
                                <input type="number" value="${exLog.min || ''}" onchange="
                                    const current = getLog('${ex.id}');
                                    const min = parseInt(this.value);
                                    const pace = calculatePace(current.km, min, current.sec);
                                    saveLog('${ex.id}', {...current, min: min, pace: pace});
                                " class="w-1/2 bg-slate-700 border border-slate-600 rounded px-1 py-1 text-sm text-center" placeholder="Min">
                                <input type="number" value="${exLog.sec || ''}" onchange="
                                    const current = getLog('${ex.id}');
                                    const sec = parseInt(this.value);
                                    const pace = calculatePace(current.km, current.min, sec);
                                    saveLog('${ex.id}', {...current, sec: sec, pace: pace});
                                " class="w-1/2 bg-slate-700 border border-slate-600 rounded px-1 py-1 text-sm text-center" placeholder="Sec">
                            </div>
                        </div>
                        <div class="col-span-2 md:col-span-1">
                            <label class="block text-xs text-slate-400 mb-1">Allure calculée</label>
                            <div class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm text-center font-mono text-emerald-400 font-bold">
                                ${calculatedPace}
                            </div>
                        </div>
                    `;
                } else if (ex.type === 'mu') {
                    html += `
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">MU Réussis (PDC)</label>
                            <input type="number" value="${exLog.succes || ''}" onchange="saveLog('${ex.id}', {...getLog('${ex.id}'), succes: parseInt(this.value)})" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-center" placeholder="ex: 3">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Sensations (1-5)</label>
                            <input type="number" max="5" value="${exLog.feel || ''}" onchange="saveLog('${ex.id}', {...getLog('${ex.id}'), feel: parseInt(this.value)})" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-center" placeholder="5 = Très frais">
                        </div>
                    `;
                } else if (ex.type === 'weight') {
                    html += `
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Lest (+kg)</label>
                            <input type="number" value="${exLog.weight || 10}" onchange="saveLog('${ex.id}', {...getLog('${ex.id}'), weight: parseFloat(this.value)})" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-center">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Reps réussies</label>
                            <input type="number" value="${exLog.reps || ''}" onchange="saveLog('${ex.id}', {...getLog('${ex.id}'), reps: parseInt(this.value)})" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-center" placeholder="ex: 4">
                        </div>
                    `;
                } else {
                    html += `
                        <div class="col-span-2">
                            <label class="block text-xs text-slate-400 mb-1">Répétitions par série (ex: 8-6-6)</label>
                            <input type="text" value="${exLog.sets || ''}" onchange="saveLog('${ex.id}', {...getLog('${ex.id}'), sets: this.value})" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-center" placeholder="8-6-6">
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            return html;
        }

        function renderHistory() {
            let html = `
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-slate-100">Historique de tes séances</h2>
                    <p class="text-sm text-slate-400 mt-1">Retrouve tes anciennes performances enregistrées.</p>
                </div>
                <div class="space-y-4">
            `;

            const dates = Object.keys(logs).sort().reverse();
            if (dates.length === 0) {
                return html + `<p class="text-slate-500 text-sm">Aucune séance enregistrée pour le moment.</p></div>`;
            }

            dates.forEach(date => {
                html += `
                    <div class="bg-slate-800 rounded-xl p-4 border border-slate-700">
                        <h4 class="font-bold text-blue-400 mb-2">${date}</h4>
                        <div class="text-xs space-y-1 font-mono text-slate-300">
                `;
                Object.keys(logs[date]).forEach(exId => {
                    const data = logs[date][exId];
                    if (exId === 'running_session') {
                        html += `<div class="text-emerald-400 font-bold">• 🏃‍♂️ Running: ${data.km || 0} km en ${data.min || 0}m${data.sec || 0}s — Allure: ${data.pace || '—'}</div>`;
                    } else {
                        html += `<div>• <span class="text-slate-400">${exId}:</span> ${JSON.stringify(data)}</div>`;
                    }
                });
                html += `</div></div>`;
            });

            html += `</div>`;
            return html;
        }

        function getLog(exId) {
            const dateToday = new Date().toISOString().split('T')[0];
            return (logs[dateToday] && logs[dateToday][exId]) ? logs[dateToday][exId] : {};
        }

        function render() {
            const container = document.getElementById('workout-container');
            if (currentTab === 'history') {
                container.innerHTML = renderHistory();
            } else {
                container.innerHTML = renderWorkout(currentTab);
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logs, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `muscleup_tracker_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Initial Render
        render();
    </script>
</body>
</html>
