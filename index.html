<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pull Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080808; --s2:#181818; --s3:#1f1f1f; --acc:#e8ff47; --acc2:#ff6b35;
  --green:#47ff8a; --blue:#47aaff; --text:#f0f0f0; --muted:#555; --border:#222;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;}

.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--acc);}
.nav-info{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}

.header{padding:32px 24px 20px;}
.header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(44px,10vw,72px);line-height:.9;letter-spacing:2px;}
.header h1 em{color:var(--acc);font-style:normal;}
.stats{display:flex;gap:24px;margin-top:20px;flex-wrap:wrap;}
.stat{text-align:center;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;}
.stat-val.y{color:var(--acc);}.stat-val.g{color:var(--green);}.stat-val.o{color:var(--acc2);}
.stat-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.week-dots{display:flex;gap:3px;margin-top:14px;flex-wrap:wrap;}
.wd{width:26px;height:26px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:1px;color:var(--muted);}
.wd.done{background:var(--acc);border-color:var(--acc);color:#000;font-weight:600;}
.wd.now{border-color:var(--acc);color:var(--acc);}

.next-banner{margin:20px 24px 0;background:var(--s2);border-left:3px solid var(--acc);padding:18px 20px;}
.next-dot-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.next-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.next-lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--acc);}
.next-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;}
.next-charge{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;margin-top:8px;}

.charge-card{margin:8px 24px 0;padding:14px 18px;display:flex;align-items:flex-start;gap:12px;}
.charge-card.up{background:#0a1a00;border:2px solid var(--green);}
.charge-card.same{background:#1a1400;border:2px solid var(--acc);}
.charge-card.down{background:#1a0800;border:2px solid var(--acc2);}
.charge-card.pdc{background:#00101a;border:2px solid var(--blue);}
.charge-icon{font-size:26px;flex-shrink:0;}
.charge-instr{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;line-height:1;}
.charge-card.up .charge-instr{color:var(--green);}
.charge-card.same .charge-instr{color:var(--acc);}
.charge-card.down .charge-instr{color:var(--acc2);}
.charge-card.pdc .charge-instr{color:var(--blue);}
.charge-why{font-size:12px;color:#999;margin-top:5px;line-height:1.5;}
.charge-why strong{color:var(--text);}

.tabs{display:flex;padding:0 24px;border-bottom:1px solid var(--border);margin-top:20px;}
.tab{padding:12px 18px;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s;}
.tab.active{color:var(--acc);border-bottom-color:var(--acc);}

.content{padding:20px 24px;display:none;}
.content.active{display:block;}

.seance-selector{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:20px;}
.s-btn{background:var(--s2);padding:14px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s;}
.s-btn.selected{border-color:var(--acc);background:var(--s3);}
.s-btn-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;}
.s-btn-tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:3px;}
.s-btn.selected .s-btn-tag{color:var(--acc);}

.exo-block{background:var(--s2);margin-bottom:8px;padding:14px 16px;}
.exo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px;}
.exo-name{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;}
.exo-tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border:1px solid;color:var(--muted);}
.exo-consigne{font-size:11px;color:#888;line-height:1.6;margin-bottom:10px;padding:8px 12px;background:var(--s3);border-left:2px solid var(--acc2);}
.exo-consigne strong{color:var(--acc2);}
.serie-rows{display:grid;gap:5px;}
.serie-row{background:var(--s3);padding:9px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.serie-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);min-width:64px;}
.rep-ctrl{display:flex;align-items:center;gap:6px;}
.rep-btn{width:30px;height:30px;background:var(--s2);border:none;color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rep-btn:hover{background:var(--acc);color:#000;}
.rep-val{font-family:'Bebas Neue',sans-serif;font-size:26px;min-width:34px;text-align:center;color:var(--acc);}
.rep-status{font-size:15px;margin-left:2px;}
.mode-badge{font-family:'DM Mono',monospace;font-size:11px;padding:3px 8px;margin-left:auto;}
.mode-badge.leste{background:#1a0e00;color:var(--acc2);border:1px solid var(--acc2);}
.mode-badge.pdc{background:#001220;color:var(--blue);border:1px solid var(--blue);}
.mode-badge.elasto{background:#001520;color:var(--blue);border:1px solid var(--blue);}

.rest-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase;}
.rest-row span{color:var(--acc);}

.feel-section{margin:14px 0;}
.feel-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.feel-btns{display:flex;gap:8px;flex-wrap:wrap;}
.feel-btn{padding:8px 14px;background:var(--s2);border:1px solid var(--border);color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s;}
.feel-btn.selected{border-color:var(--acc);color:var(--acc);background:var(--s3);}

.submit-btn{width:100%;padding:16px;background:var(--acc);color:#000;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;border:none;cursor:pointer;margin-top:8px;}

.hist-list{display:grid;gap:2px;max-width:700px;}
.hist-item{background:var(--s2);padding:12px 16px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;}
.hist-info{min-width:76px;}
.hist-date{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.hist-type{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;}
.hist-exos{flex:1;display:flex;flex-wrap:wrap;gap:5px;}
.hist-chip{background:var(--s3);padding:3px 8px;font-family:'DM Mono',monospace;font-size:10px;color:var(--acc);}
.hist-actions{display:flex;gap:6px;}
.btn-edit{background:var(--s3);color:var(--text);border:1px solid var(--border);padding:7px 10px;cursor:pointer;font-size:13px;}
.btn-del{background:#1a0000;color:#ff4444;border:1px solid #880000;padding:7px 10px;cursor:pointer;font-size:13px;}

.advice-box{background:var(--s2);border-left:3px solid var(--acc2);padding:14px 18px;margin-bottom:10px;max-width:700px;}
.advice-box h3{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;color:var(--acc2);margin-bottom:5px;}
.advice-box p{font-size:12px;color:#aaa;line-height:1.7;}
.prog-card{background:var(--s2);padding:18px;margin-bottom:2px;max-width:700px;}
.prog-card h3{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.pbar-wrap{margin-bottom:8px;}
.pbar-labels{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;}
.pbar-labels span:first-child{color:var(--muted);}
.pbar-labels span:last-child{color:var(--acc);font-family:'DM Mono',monospace;}
.pbar{height:3px;background:var(--s3);}
.pbar-fill{height:100%;background:var(--acc);transition:width .5s;}

.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty div{font-size:36px;margin-bottom:8px;}
.empty p{font-size:12px;}
.toast{position:fixed;bottom:28px;right:24px;background:var(--acc);color:#000;padding:10px 18px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;transform:translateY(60px);opacity:0;transition:all .3s;z-index:999;}
.toast.show{transform:translateY(0);opacity:1;}

@media(max-width:580px){
  .nav,.header,.content{padding-left:16px;padding-right:16px;}
  .next-banner,.charge-card{margin-left:16px;margin-right:16px;}
  .tabs{padding:0 16px;}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-logo">PULL•TRACKER</div>
  <div class="nav-info" id="navInfo">Semaine 1</div>
</div>

<div class="header">
  <h1>MON <em>PROG</em></h1>
  <div class="week-dots" id="weekDots"></div>
  <div class="stats">
    <div class="stat"><div class="stat-val y" id="statMax">12</div><div class="stat-lbl">Max PDC</div></div>
    <div class="stat"><div class="stat-val g" id="statSessions">0</div><div class="stat-lbl">Séances</div></div>
    <div class="stat"><div class="stat-val o" id="statKg">10</div><div class="stat-lbl">Kg lesté</div></div>
  </div>
</div>

<div class="next-banner">
  <div class="next-dot-row"><div class="next-dot"></div><div class="next-lbl">Prochaine séance</div></div>
  <div class="next-title" id="nextTitle">—</div>
  <div class="next-charge" id="nextCharge"></div>
</div>
<div id="chargeCard"></div>

<div class="tabs">
  <div class="tab active" onclick="showTab('log')">Enregistrer</div>
  <div class="tab" onclick="showTab('history')">Historique</div>
  <div class="tab" onclick="showTab('analyse')">Analyse</div>
</div>

<div class="content active" id="tab-log">
  <div style="max-width:700px;">
    <div class="seance-selector" style="grid-template-columns:1fr 1fr;gap:2px;margin-bottom:8px;">
      <div class="s-btn selected" id="sbtn-P1" onclick="selectSeance('P1')">
        <div class="s-btn-name">PULL 1</div>
        <div class="s-btn-tag">Volume · PDC</div>
      </div>
      <div class="s-btn" id="sbtn-P2" onclick="selectSeance('P2')">
        <div class="s-btn-name">PULL 2</div>
        <div class="s-btn-tag">Force · Lesté</div>
      </div>
    </div>
    <div onclick="selectSeance('PB')" id="sbtn-PB" style="background:var(--s2);border:2px solid var(--acc2);padding:14px;text-align:center;cursor:pointer;margin-bottom:20px;transition:all .2s;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--acc2);">🏅 BONUS WEEKEND</div>
      <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--acc2);opacity:.7;margin-top:3px;">Endurance · Volume léger · 20-30 min</div>
    </div>
    <div id="exoContainer"></div>
    <div class="feel-section">
      <div class="feel-lbl">Ressenti global</div>
      <div class="feel-btns">
        <div class="feel-btn" onclick="selectFeel('💀')" id="feel-💀">💀 Dur</div>
        <div class="feel-btn selected" onclick="selectFeel('😐')" id="feel-😐">😐 Normal</div>
        <div class="feel-btn" onclick="selectFeel('💪')" id="feel-💪">💪 Bien</div>
        <div class="feel-btn" onclick="selectFeel('🔥')" id="feel-🔥">🔥 En feu</div>
      </div>
    </div>
    <button class="submit-btn" id="submitBtn" onclick="saveSession()">VALIDER LA SÉANCE →</button>
  </div>
</div>

<div class="content" id="tab-history">
  <div class="hist-list" id="histList"></div>
</div>

<div class="content" id="tab-analyse">
  <div id="analyseContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SEANCES = {
  P1: {
    name: 'PULL 1',
    tag: 'Volume · PDC · Élastique',
    exos: [
      { id:'p1_pdc', name:'Traction PDC', mode:'pdc', tag:'🏋 PDC',
        consigne:'<strong>3 séries Max −1</strong> · Garde toujours 1 rep en réserve',
        series:[{label:'Série 1',def:11},{label:'Série 2',def:11},{label:'Série 3',def:10}] },
      { id:'p1_emom', name:'EMOM Élastique', mode:'elasto', tag:'🔵 ÉLASTIQUE',
        consigne:'<strong>7 rounds × 5-7 reps</strong> · 1 round par minute, élastique en aide. Note le nb de reps moyen.',
        series:[{label:'Reps moy.',def:6}] },
      { id:'p1_austro', name:'Australienne + Pompe', mode:'pdc', tag:'🏋 PDC',
        consigne:'<strong>2 séries Max−1 + Max−1</strong> · Enchaîne sans pause australiennes puis pompes classiques',
        series:[{label:'Austro S1',def:12},{label:'Pompe S1',def:12},{label:'Austro S2',def:11},{label:'Pompe S2',def:11}] },
      { id:'p1_suspension', name:'Suspension', mode:'pdc', tag:'🏋 PDC',
        consigne:'<strong>3 séries max (secondes)</strong> · Temps suspendu à la barre. Magnésie conseillée.',
        series:[{label:'Série 1',def:20},{label:'Série 2',def:18},{label:'Série 3',def:15}] },
      { id:'p1_circuit', name:'Circuit 8 min', mode:'pdc', tag:'🏋 PDC',
        consigne:'<strong>8 min max de tours</strong> · 5 burpees → 10 austro → 5 dips → 10 biceps curl',
        series:[{label:'Nb de tours',def:3}] },
    ]
  },
  PB: {
    name: 'BONUS WEEKEND',
    tag: 'Endurance · Volume léger · 20-30 min',
    exos: [
      { id:'pb_gtg', name:'Échauffement — Mini-sets', mode:'pdc', tag:'🏋 PDC',
        consigne:'<strong>5 × 5 reps en chauffe</strong> · 40% de ton max. Repos 60 sec entre chaque. C\'est juste pour activer, pas fatiguer.',
        series:[{label:'Set 1',def:5},{label:'Set 2',def:5},{label:'Set 3',def:5},{label:'Set 4',def:5},{label:'Set 5',def:5}] },
      { id:'pb_large', name:'Traction Prise Large', mode:'pdc', tag:'🏋 PDC',
        consigne:'<strong>3 × 6-8 reps</strong> · Prise plus large que les épaules. Travaille l\'ouverture dorsale. Descente lente.',
        series:[{label:'Série 1',def:7},{label:'Série 2',def:7},{label:'Série 3',def:6}] },
      { id:'pb_curl', name:'Curl Barre / Haltères', mode:'leste', tag:'⚖️ CHARGÉ',
        consigne:'<strong>3 × 10-12 reps</strong> · Charge modérée, amplitude complète. Pas de balancier.',
        series:[{label:'Série 1',def:12},{label:'Série 2',def:11},{label:'Série 3',def:10}] },
      { id:'pb_iso', name:'Isométrie Haute', mode:'pdc', tag:'🏋 PDC',
        consigne:'<strong>4 × 10-15 sec</strong> · Tiens en position haute (menton au-dessus de la barre). Repos 60 sec.',
        series:[{label:'Hold 1',def:12},{label:'Hold 2',def:12},{label:'Hold 3',def:10},{label:'Hold 4',def:10}] },
      { id:'pb_elasto_vol', name:'Traction Élastique Volume', mode:'elasto', tag:'🔵 ÉLASTIQUE',
        consigne:'<strong>2 × 15 reps</strong> · Élastique pour tenir le volume haut. Amplitude complète, mouvement lent.',
        series:[{label:'Série 1',def:15},{label:'Série 2',def:15}] },
    ]
  },
  P2: {
    name: 'PULL 2',
    tag: 'Force · Lesté · PDC',
    exos: [
      { id:'p2_leste', name:'Traction Lestée', mode:'leste', tag:'⚖️ LESTÉ',
        consigne:'<strong>3 × 4 reps · RPE progressif</strong> · Augmente la charge semaine après semaine. Garde de la réserve.',
        series:[{label:'Série 1',def:4},{label:'Série 2',def:4},{label:'Série 3',def:4}] },
      { id:'p2_pdc', name:'Traction PDC', mode:'pdc', tag:'🏋 PDC',
        consigne:'<strong>2 séries Max −1</strong> · Garde 1 rep en réserve',
        series:[{label:'Série 1',def:11},{label:'Série 2',def:10}] },
      { id:'p2_elasto', name:'Traction Élastique', mode:'elasto', tag:'🔵 ÉLASTIQUE',
        consigne:'<strong>2 séries Max −1</strong> · Élastique en aide pour aller au-delà de ton max PDC',
        series:[{label:'Série 1',def:13},{label:'Série 2',def:12}] },
      { id:'p2_austro', name:'Australienne + Pompe', mode:'pdc', tag:'🏋 PDC',
        consigne:'<strong>3 séries Max−1 + Max−1</strong> · Touche bien la barre en bas des pecs',
        series:[{label:'Austro S1',def:12},{label:'Pompe S1',def:12},{label:'Austro S2',def:11},{label:'Pompe S2',def:11},{label:'Austro S3',def:10},{label:'Pompe S3',def:10}] },
      { id:'p2_biceps', name:'Biceps Curl', mode:'leste', tag:'⚖️ CHARGÉ',
        consigne:'<strong>3 × 12</strong> · Charge proche de l\'échec. Augmente quand c\'est trop facile.',
        series:[{label:'Série 1',def:12},{label:'Série 2',def:12},{label:'Série 3',def:12}] },
    ]
  }
};

let state = JSON.parse(localStorage.getItem('pulltracker_v2') || 'null') || { maxPdc:12, weightKg:10, sessions:[] };
if (!state.weightKg) state.weightKg = 10;
if (!state.maxPdc)   state.maxPdc   = 12;

let selectedSeance = 'P1';
let selectedFeel   = '😐';
let currentReps    = {};

function init() {
  const mainSessions = state.sessions.filter(s => s.type !== 'PB');
  const next = ['P1','P2'][mainSessions.length % 2];
  selectSeance(next, true);
  updateHeader();
  updateBanner();
  renderHistory();
  renderAnalyse();
}

function updateHeader() {
  document.getElementById('statMax').textContent      = state.maxPdc;
  document.getElementById('statSessions').textContent = state.sessions.length;
  document.getElementById('statKg').textContent       = state.weightKg;
  const mainSessions = state.sessions.filter(s => s.type !== 'PB');
  document.getElementById('navInfo').textContent      = 'Semaine ' + (Math.floor(mainSessions.length / 2) + 1);
  const dots = document.getElementById('weekDots');
  dots.innerHTML = '';
  // Show main session dots + bonus indicator
  for (let i = 0; i < 16; i++) {
    const d = document.createElement('div');
    d.className = 'wd';
    d.textContent = i % 2 === 0 ? 'P1' : 'P2';
    if (i < mainSessions.length) d.classList.add('done');
    else if (i === mainSessions.length) d.classList.add('now');
    dots.appendChild(d);
  }
  // Bonus count
  const bonusCount = state.sessions.filter(s => s.type === 'PB').length;
  if (bonusCount > 0) {
    const b = document.createElement('div');
    b.className = 'wd done';
    b.style.cssText = 'background:var(--acc2);border-color:var(--acc2);color:#000;font-size:8px;';
    b.textContent = '×'+bonusCount;
    b.title = bonusCount + ' séance(s) bonus';
    dots.appendChild(b);
  }
}

function computeChargeAdvice() {
  const lastP2 = state.sessions.filter(s => s.type === 'P2').slice(-1)[0];
  if (!lastP2) return { css:'same', icon:'⚖️', instr:'LESTÉ +'+state.weightKg+' KG', why:'Ton niveau actuel — mets +'+state.weightKg+' kg sur toutes les tractions lestées.' };
  const reps   = lastP2.exos?.p2_leste || [];
  const feel   = lastP2.feel;
  const lastKg = lastP2.weightKg || state.weightKg || 10;
  const aboveTarget = reps.filter(r => r >= 4).length;
  if (reps[0] < 3) return { css:'down', icon:'📉', instr:'DESCENDS À +'+ Math.max(lastKg-2.5,5)+' KG', why:'<strong>Trop lourd</strong> — 1ère série sous 3 reps. Réduis pour garder la bonne forme.' };
  if (aboveTarget >= 2 && (feel==='💪'||feel==='🔥')) {
    const newKg = lastKg + 2.5;
    state.weightKg = newKg;
    localStorage.setItem('pulltracker_v2', JSON.stringify(state));
    return { css:'up', icon:'📈', instr:'MONTE À +'+newKg+' KG', why:'<strong>'+aboveTarget+'/3 séries réussies à +'+lastKg+' kg</strong> et ressenti '+feel+' — tu peux progresser !' };
  }
  if (feel==='💀') return { css:'down', icon:'📉', instr:'DESCENDS À +'+Math.max(lastKg-2.5,5)+' KG', why:'<strong>Séance difficile à +'+lastKg+' kg</strong> — réduis légèrement.' };
  return { css:'same', icon:'⚖️', instr:'GARDE +'+lastKg+' KG', why:'<strong>Bonne séance à +'+lastKg+' kg</strong> — même charge, améliore les reps.' };
}

function updateBanner() {
  const next   = ['P1','P2'][state.sessions.filter(s=>s.type!=='PB').length % 2];
  const seance = SEANCES[next];
  document.getElementById('nextTitle').textContent = seance.name + ' — ' + seance.tag;
  const chargeEl = document.getElementById('nextCharge');
  const card     = document.getElementById('chargeCard');
  if (next === 'P1') {
    chargeEl.style.color = 'var(--blue)';
    chargeEl.textContent = '🏋 POIDS DE CORPS — pas de charge';
    card.innerHTML = '';
    return;
  }
  const { css, icon, instr, why } = computeChargeAdvice();
  const colors = { up:'var(--green)', same:'var(--acc)', down:'var(--acc2)', pdc:'var(--blue)' };
  chargeEl.style.color = colors[css];
  chargeEl.textContent = icon + ' ' + instr;
  card.innerHTML = `<div class="charge-card ${css}"><div class="charge-icon">${icon}</div><div><div class="charge-instr">${instr}</div><div class="charge-why">${why}</div></div></div>`;
}

function selectSeance(type, silent) {
  selectedSeance = type;
  ['P1','P2'].forEach(t => {
    const btn = document.getElementById('sbtn-'+t);
    if (btn) btn.classList.toggle('selected', t===type);
  });
  // BONUS button styling
  const pb = document.getElementById('sbtn-PB');
  if (pb) {
    pb.style.background = type==='PB' ? '#1a0a00' : 'var(--s2)';
    pb.style.borderColor = 'var(--acc2)';
  }
  renderExos();
}

function renderExos() {
  const seance = SEANCES[selectedSeance];
  currentReps  = {};
  const container = document.getElementById('exoContainer');
  container.innerHTML = '';
  const modeColors = { pdc:'var(--blue)', leste:'var(--acc2)', elasto:'var(--blue)' };

  seance.exos.forEach((exo, exoIdx) => {
    currentReps[exo.id] = exo.series.map(s => s.def);
    const block = document.createElement('div');
    block.className = 'exo-block';
    let seriesHTML = '';
    exo.series.forEach((s, i) => {
      const kgInfo = (exo.id === 'p2_leste') ? ` · <span style="color:var(--acc2)">+${state.weightKg} kg</span>` : '';
      seriesHTML += `<div class="serie-row">
        <div class="serie-lbl">${s.label}</div>
        <div class="rep-ctrl">
          <button class="rep-btn" onclick="changeRep('${exo.id}',${i},-1)">−</button>
          <div class="rep-val" id="rv-${exo.id}-${i}">${s.def}</div>
          <button class="rep-btn" onclick="changeRep('${exo.id}',${i},+1)">+</button>
        </div>
        <div class="rep-status" id="rs-${exo.id}-${i}">—</div>
        <span class="mode-badge ${exo.mode}">${exo.tag}${kgInfo}</span>
      </div>`;
    });
    block.innerHTML = `
      <div class="exo-header">
        <div class="exo-name">${exo.name}</div>
        <div class="exo-tag" style="color:${modeColors[exo.mode]};border-color:${modeColors[exo.mode]}">${exo.tag}</div>
      </div>
      <div class="exo-consigne">${exo.consigne}</div>
      <div class="serie-rows">${seriesHTML}</div>`;
    container.appendChild(block);
    if (exoIdx < seance.exos.length - 1) {
      const rest = document.createElement('div');
      rest.className = 'rest-row';
      rest.innerHTML = '— repos <span>2 à 3 min</span> —';
      container.appendChild(rest);
    }
  });
}

function changeRep(exoId, idx, delta) {
  currentReps[exoId][idx] = Math.max(0, currentReps[exoId][idx] + delta);
  const el = document.getElementById('rv-'+exoId+'-'+idx);
  if (el) el.textContent = currentReps[exoId][idx];
  const exo    = SEANCES[selectedSeance].exos.find(e => e.id === exoId);
  const target = exo?.series[idx]?.def || 0;
  const status = document.getElementById('rs-'+exoId+'-'+idx);
  if (status) { const v = currentReps[exoId][idx]; status.textContent = v > target ? '🔥' : v === target ? '✅' : v >= target-1 ? '👌' : '❌'; }
}

function selectFeel(f) {
  selectedFeel = f;
  ['💀','😐','💪','🔥'].forEach(e => document.getElementById('feel-'+e).classList.toggle('selected', e===f));
}

function saveSession() {
  const pdcId = selectedSeance==='P1' ? 'p1_pdc' : 'p2_pdc';
  if (currentReps[pdcId]?.[0] > state.maxPdc) state.maxPdc = currentReps[pdcId][0];
  state.sessions.push({ type:selectedSeance, date:new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}), exos:JSON.parse(JSON.stringify(currentReps)), feel:selectedFeel, weightKg:state.weightKg, ts:Date.now() });
  localStorage.setItem('pulltracker_v2', JSON.stringify(state));
  const btn = document.getElementById('submitBtn');
  btn.textContent = 'VALIDER LA SÉANCE →';
  btn.onclick = saveSession;
  showToast('SÉANCE ENREGISTRÉE 🔥');
  init();
  showTab('history');
}

function renderHistory() {
  const list = document.getElementById('histList');
  if (!state.sessions.length) { list.innerHTML = `<div class="empty"><div>📋</div><p>Aucune séance enregistrée.</p></div>`; return; }
  list.innerHTML = '';
  [...state.sessions].reverse().forEach((s, ri) => {
    const realIdx = state.sessions.length - 1 - ri;
    const item = document.createElement('div');
    item.className = 'hist-item';
    let chips = '';
    Object.entries(s.exos||{}).forEach(([exoId, reps]) => {
      const exo  = (SEANCES[s.type]?.exos||[]).find(e => e.id===exoId);
      const name = exo ? exo.name : exoId;
      const kg   = (exo?.mode==='leste' && s.weightKg) ? ' +'+s.weightKg+'kg' : '';
      chips += `<span class="hist-chip">${name}: ${reps.join('/')}${kg}</span>`;
    });
    item.innerHTML = `
      <div class="hist-info"><div class="hist-date">${s.date}</div><div class="hist-type">${s.type} ${s.feel}</div></div>
      <div class="hist-exos">${chips}</div>
      <div class="hist-actions">
        <button class="btn-edit" onclick="editSession(${realIdx})">✏️</button>
        <button class="btn-del"  onclick="deleteSession(${realIdx})">🗑</button>
      </div>`;
    list.appendChild(item);
  });
}

function deleteSession(i) {
  document.getElementById('delConfirm')?.remove();
  const d = document.createElement('div');
  d.id = 'delConfirm';
  d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#1a0000;border-top:2px solid #ff4444;padding:18px 24px;z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;';
  d.innerHTML = `<div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:#ff4444;letter-spacing:1px;">Supprimer cette séance ?</div>
    <div style="display:flex;gap:8px;">
      <button onclick="confirmDelete(${i})" style="background:#ff4444;color:#000;border:none;padding:10px 18px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;cursor:pointer;">OUI</button>
      <button onclick="document.getElementById('delConfirm').remove()" style="background:#222;color:#aaa;border:1px solid #333;padding:10px 14px;font-family:'Bebas Neue',sans-serif;font-size:14px;cursor:pointer;">ANNULER</button>
    </div>`;
  document.body.appendChild(d);
}

function confirmDelete(i) {
  document.getElementById('delConfirm')?.remove();
  state.sessions.splice(i, 1);
  localStorage.setItem('pulltracker_v2', JSON.stringify(state));
  showToast('SÉANCE SUPPRIMÉE');
  init();
}

function editSession(i) {
  const s = state.sessions[i];
  showTab('log');
  selectSeance(s.type, false);
  selectedFeel = s.feel;
  ['💀','😐','💪','🔥'].forEach(e => document.getElementById('feel-'+e)?.classList.toggle('selected', e===s.feel));
  setTimeout(() => {
    Object.entries(s.exos||{}).forEach(([exoId, reps]) => {
      reps.forEach((r, idx) => {
        if (!currentReps[exoId]) currentReps[exoId] = [];
        currentReps[exoId][idx] = r;
        const el = document.getElementById('rv-'+exoId+'-'+idx);
        if (el) el.textContent = r;
      });
    });
    const btn = document.getElementById('submitBtn');
    btn.textContent = 'ENREGISTRER LES MODIFICATIONS →';
    btn.onclick = () => {
      state.sessions[i] = { ...s, exos:JSON.parse(JSON.stringify(currentReps)), feel:selectedFeel };
      localStorage.setItem('pulltracker_v2', JSON.stringify(state));
      btn.textContent = 'VALIDER LA SÉANCE →';
      btn.onclick = saveSession;
      showToast('MODIFIÉ ✅');
      init();
      showTab('history');
    };
  }, 60);
}

function renderAnalyse() {
  const c = document.getElementById('analyseContent');
  if (!state.sessions.length) { c.innerHTML = `<div class="empty"><div>📊</div><p>Enregistre ta première séance.</p></div>`; return; }
  c.innerHTML = '';
  const { css, icon, instr, why } = computeChargeAdvice();
  const last = state.sessions[state.sessions.length-1];
  const msgs = { '🔥':'Excellente séance ! ', '💪':'Bonne séance. ', '💀':'Séance difficile. ', '😐':'Séance correcte. ' };
  const box = document.createElement('div');
  box.className = 'advice-box';
  box.innerHTML = `<h3>${icon} CONSEIL PROCHAINE PULL 2</h3><p>${msgs[last.feel]||''}${instr}. ${why.replace(/<[^>]+>/g,'')}</p>`;
  c.appendChild(box);

  const p2s = state.sessions.filter(s => s.type==='P2');
  if (p2s.length) {
    const card = document.createElement('div');
    card.className = 'prog-card';
    let html = '<h3>Traction Lestée — progression</h3>';
    p2s.forEach((s,i) => {
      const reps = (s.exos?.p2_leste||[])[0]||0;
      const kg   = s.weightKg||10;
      html += `<div class="pbar-wrap"><div class="pbar-labels"><span>S${i+1} · ${s.date} · +${kg}kg</span><span>${reps} reps</span></div><div class="pbar"><div class="pbar-fill" style="width:${Math.min(reps/6*100,100)}%"></div></div></div>`;
    });
    card.innerHTML = html;
    c.appendChild(card);
  }

  const p1s = state.sessions.filter(s => s.type==='P1');
  if (p1s.length) {
    const card = document.createElement('div');
    card.className = 'prog-card';
    let html = '<h3>Traction PDC — 1ère série (Pull 1)</h3>';
    p1s.forEach((s,i) => {
      const reps = (s.exos?.p1_pdc||[])[0]||0;
      html += `<div class="pbar-wrap"><div class="pbar-labels"><span>S${i+1} · ${s.date}</span><span>${reps} reps</span></div><div class="pbar"><div class="pbar-fill" style="width:${Math.min(reps/18*100,100)}%"></div></div></div>`;
    });
    card.innerHTML = html;
    c.appendChild(card);
  }
}

function showTab(id) {
  document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  document.querySelectorAll('.tab').forEach(el => { if (el.getAttribute('onclick')?.includes(id)) el.classList.add('active'); });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
